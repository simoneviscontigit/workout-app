<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:#09090b;color:#fafafa;font-family:"Space Grotesk",-apple-system,system-ui,sans-serif;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;letter-spacing:-.01em;max-width:440px;margin:0 auto;min-height:100vh;overscroll-behavior:contain}
.btn,.lbl,.font-display{font-family:"Space Grotesk",sans-serif}
.lbl{letter-spacing:2px}
.pg{padding:18px;min-height:100vh;padding-bottom:90px}
.card{background:linear-gradient(180deg,#212126,#161619);border:1px solid #30303a;border-radius:18px;padding:15px;margin-bottom:11px;box-shadow:0 1px 2px rgba(0,0,0,.35),0 14px 30px -16px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.04)}
.lbl{color:#52525b;font-size:10px;letter-spacing:2px;text-transform:uppercase;font-weight:700}
.btn{display:block;width:100%;border:none;border-radius:16px;padding:16px;font-size:16px;font-weight:900;cursor:pointer;color:#fff;margin-bottom:8px;text-align:center;transition:transform .15s cubic-bezier(.2,.8,.2,1),filter .15s,box-shadow .15s;box-shadow:0 10px 26px -8px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.22);letter-spacing:.02em}
.btn:active{filter:brightness(1.08)}
.btn-ghost{display:block;width:100%;background:transparent;color:#71717a;border:1px solid #27272a;border-radius:12px;padding:12px;font-size:13px;cursor:pointer;margin-bottom:8px}
.back{background:#27272a;border:none;border-radius:10px;padding:9px 14px;color:#a1a1aa;font-size:13px;cursor:pointer}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:10px}
.pb{height:3px;background:#27272a;border-radius:99px}
.pbf{height:3px;border-radius:99px;transition:width .4s}
.opt{background:#18181b;border:1px solid #27272a;border-radius:12px;padding:13px 16px;color:#d4d4d8;font-size:14px;cursor:pointer;text-align:left;width:100%;display:block;margin-bottom:7px}
.opt.sel{background:#3d1200;border-color:#f97316;color:#fafafa}
.hdr{display:flex;align-items:center;margin-bottom:18px;gap:8px}
.center{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:24px;text-align:center}
.ex-media{width:100%;max-height:220px;object-fit:cover;border-radius:14px;display:block}
.img-fb{width:100%;height:160px;border-radius:14px;align-items:center;justify-content:center;flex-direction:column;gap:8px}
.macro-bar{height:7px;background:#27272a;border-radius:99px;overflow:hidden;margin-top:3px;margin-bottom:10px}
.mfill{height:7px;border-radius:99px}
.score-ring{width:76px;height:76px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:900;border:4px solid;margin:0 auto 12px}
textarea,input[type=text]{background:#18181b;border:1px solid #27272a;border-radius:12px;color:#fafafa;font-size:14px;padding:12px;width:100%;outline:none;font-family:inherit;margin-bottom:8px;resize:none}
.chat-msg{padding:10px 14px;border-radius:14px;margin-bottom:7px;font-size:13px;line-height:1.5}
.tag-core{background:#422006;border:1px solid #92400e;border-radius:7px;padding:4px 10px;display:inline-block;margin-bottom:8px;color:#fbbf24;font-size:10px;font-weight:700;letter-spacing:1px}
.tag-band{background:#1a1500;border:1px solid #ca8a0440;border-radius:10px;padding:8px 12px;margin-bottom:10px;display:flex;align-items:center;gap:6px;color:#fbbf24;font-size:13px;font-weight:600}
/* ── Floating AI ── */
.ai-fab{position:fixed;bottom:24px;right:18px;width:54px;height:54px;border-radius:50%;background:#f97316;border:none;cursor:pointer;font-size:18px;font-weight:900;letter-spacing:-.5px;box-shadow:0 4px 24px #f9731640;z-index:1000;display:flex;align-items:center;justify-content:center;color:#fff;transition:transform .15s}
.ai-fab:active{transform:scale(.92)}
.ai-slide{position:fixed;bottom:0;left:50%;transform:translateX(-50%) translateY(102%);width:100%;max-width:440px;background:#18181b;border-top:1px solid #f9731640;border-radius:20px 20px 0 0;z-index:999;transition:transform .28s cubic-bezier(.32,1,.45,1);display:flex;flex-direction:column;max-height:72vh}
.ai-slide.open{transform:translateX(-50%) translateY(0)}
.ai-slide-head{padding:14px 16px 10px;border-bottom:1px solid #27272a;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.ai-ctx-pill{background:#27272a;border-radius:20px;padding:5px 12px;font-size:11px;color:#a1a1aa;font-weight:600;max-width:220px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.ai-slide-msgs{flex:1;overflow-y:auto;padding:12px 14px;-webkit-overflow-scrolling:touch}
.ai-slide-input{padding:12px 14px 20px;border-top:1px solid #27272a;flex-shrink:0;display:flex;gap:8px;background:#18181b}
.ai-slide-input input{margin:0;flex:1}
.ai-send-btn{background:#f97316;border:none;border-radius:10px;color:#fff;font-size:13px;font-weight:700;padding:0 16px;cursor:pointer;white-space:nowrap;flex-shrink:0}
/* ── Motion + taste (emil-anim skill) ── */
.btn-ghost,.back,.ai-send-btn{transition:transform .15s cubic-bezier(.2,.8,.2,1),border-color .2s,background .2s}
.opt{transition:transform .15s cubic-bezier(.2,.8,.2,1),border-color .2s,background .2s}
.btn:active,.btn-ghost:active,.back:active,.ai-send-btn:active{transform:scale(.97)}
.opt:active{transform:scale(.985)}
.opt.sel{box-shadow:0 0 0 1px #f97316,0 8px 26px -12px #f9731685}
.tag-band{transition:transform .15s cubic-bezier(.2,.8,.2,1)}
.tag-band:active{transform:scale(.98)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition-duration:.01ms!important}}
/* ── BRUTALISM tokens ── */
*{border-radius:0!important}
.ai-fab{border:2px solid #fafafa!important;box-shadow:none!important;font-weight:700!important}
.ex-media{border:2px solid #27272a}
.card{border-radius:0;border:2px solid #27272a;background:#0e0e11;box-shadow:none}
.btn{border-radius:0;text-transform:uppercase;letter-spacing:.05em;box-shadow:none;font-weight:700}
.btn-ghost,.back,.opt{border-radius:0}
.opt{border-width:2px}
.lbl{text-transform:uppercase}
.marq-wrap{overflow:hidden;white-space:nowrap;background:#F97316;color:#000}
.marq{display:inline-block;padding:7px 0;font-weight:700;font-size:13px;letter-spacing:1px;text-transform:uppercase;animation:marq 18s linear infinite}
@keyframes marq{from{transform:translateX(0)}to{transform:translateX(-50%)}}
/* ── Modalità Recupero (post-intervento): vira l'accento arancio su CIANO ── */
body.recovery .marq-wrap{background:#06b6d4!important;color:#00232b!important}
body.recovery .ai-fab{background:#06b6d4!important}
body.recovery .ai-send-btn{background:#06b6d4!important}
body.recovery .ai-slide{border-top-color:#06b6d466!important}
body.recovery .opt.sel{background:#083344!important;border-color:#06b6d4!important;box-shadow:0 0 0 1px #06b6d4,0 8px 26px -12px #06b6d485!important}
body.recovery button[style*="background:#F97316"],body.recovery div[style*="background:#F97316"]{background:#06b6d4!important;border-color:#06b6d4!important;color:#00232b!important}
body.recovery button[style*="color:#F97316"],body.recovery button[style*="color:#f97316"]{color:#06b6d4!important}
body.recovery button[style*="#f97316"],body.recovery button[style*="#F97316"]{border-color:#06b6d4!important}
</style>

const RECOVERY_OP_DATE='2026-07-13';
const RECOVERY_PHASES=[
 {ph:1,fromDay:10,toDay:14,mult:0.6, setsAdj:-2,maxMin:1,label:'Riattivazione',note:'Isolamento leggero · ~2 serie · zero apnea/spinta, niente overhead o chinarsi'},

];
// Fase minima ammessa per esercizio (1=sicuro da g10, 2=da g15, 3=da g20). Default 1.
const RECOVERY_MIN={p1:3,p2:3,p3:2,p4:1,p5:3,p6:1,p7:2, r1:3,r2:2,r3:1,r4:1,r5:2,r6:2, s1:3,s2:1,s3:2,s4:1, l1:3,l2:2,l3:2,l4:2,l5:3, k1:9,k2:9,k3:9,k4:9};
function recoveryDayN(){return Math.floor((Date.now()-new Date(RECOVERY_OP_DATE+'T00:00:00'))/86400000);}
function recoveryActive(){var rm=S.aiDB&&S.aiDB.recoveryMode;return !!(rm&&rm.active);}
// Fase corrente {ph,mult,setsAdj,maxMin,label,note,dayN,waiting} o null se non attiva / ciclo finito.
function recoveryPhase(){
 if(!recoveryActive())return null;
 var d=recoveryDayN();
 if(d>=30)return null;                 // ciclo concluso → nessuna modulazione
 for(var i=0;i<RECOVERY_PHASES.length;i++){var p=RECOVERY_PHASES[i];if(d>=p.fromDay&&d<=p.toDay)return Object.assign({dayN:d,waiting:false},p);}
 if(d<10)return Object.assign({dayN:d,waiting:true},RECOVERY_PHASES[0]); // pre-g10: attesa; se si allena, fase più leggera
 return null;
}
function recoveryAllows(ex){var p=recoveryPhase();if(!p)return true;return (RECOVERY_MIN[ex.id]||1)<=p.maxMin;}
// Init una-tantum + auto-uscita a g30 (ciano off, progressione normale). Chiamata da loadData.
function recoveryInit(){
 if(!S.aiDB)return;
 if(typeof S.aiDB.recoveryMode==='undefined'){
  S.aiDB.recoveryMode={active:true,startDate:RECOVERY_OP_DATE,updatedAt:new Date().toISOString()};
  sv('ai',S.aiDB);
 }
 if(S.aiDB.recoveryMode.active&&recoveryDayN()>=30){
  S.aiDB.recoveryMode.active=false;
  S.aiDB.recoveryMode.updatedAt=new Date().toISOString();
  sv('ai',S.aiDB);
  if(typeof syncToDrive==='function')setTimeout(syncToDrive,3500);
 }
}

function applyAdaptation(ex){
 var a=S.aiDB.adaptation||{};
 var mult=a.repsMultiplier||1;
 var setsAdj=a.setsAdjustment||0;
 // Modalità Recupero: modula l'intensità in base alla fase (moltiplicatore reps/time + serie)
 var _rp=(typeof recoveryPhase==='function')?recoveryPhase():null;
 if(_rp){mult*=_rp.mult;setsAdj+=_rp.setsAdj;}
 // DOMS/muscoli indolenziti: NESSUNA regola automatica (deciso 2026-08-02) — DOMS = il
 // muscolo ha lavorato, non un problema. Il dato (preCheck) va a Sumi nel contesto_atleta:
 // e' lei a valutare se e' cautela (forte/persistente) o normale adattamento.
 if(mult===1&&setsAdj===0)return ex;
 var newEx=Object.assign({},ex);
 if(ex.isTime){
  newEx.time=Math.max(10,Math.round((ex.time||30)*mult));
 } else {
  newEx.reps=Math.max(5,Math.round((ex.reps||8)*mult));
  if(ex.repsMax) newEx.repsMax=Math.max(newEx.reps+1,Math.round((ex.repsMax)*mult));
 }
 newEx.sets=Math.max(2,(ex.sets||3)+setsAdj);
 return newEx;
}

// ATTREZZATURA (11/08/2026): "elastici" o "palestra", da coachPlan.global (lo scrive
// coach_llm.py --set-attrezzatura). Cambia lo snap e il passo di progressione, perché
// cambia cosa è fisicamente componibile: le combo di {5,10,15,25,25} sono multipli di 5
// col tetto a 80, un pacco pesi no. Default elastici: un blob vecchio non deve finire in
// palestra per omissione.
function attrezzatura(){try{return (S.aiDB.coachPlan&&S.aiDB.coachPlan.global&&S.aiDB.coachPlan.global.attrezzatura)==='palestra'?'palestra':'elastici';}catch(e){return 'elastici';}}
var STEP_ATTREZZO={manubri:2,bilanciere:2.5,macchina:5,cavo:5};
function stepDi(id){
 var a='';try{a=((S.aiDB.coachPlan.perExercise[id]||{}).attrezzo||'').toLowerCase();}catch(e){}
 for(var k in STEP_ATTREZZO){if(a.indexOf(k)>=0)return STEP_ATTREZZO[k];}
 return 2.5;
}
function nextBandStep(band,id){
 // Elastici: +5kg (la banda più piccola). Palestra: un passo dell'attrezzo — +5 su un
 // manubrio è un salto del 25%, non una progressione.
 if(!band)return band;
 var st=attrezzatura()==='palestra'?stepDi(id):5;
 return band.replace(/\d+(?:[.,]\d+)?/g,function(m){
  var v=parseFloat(m.replace(',','.'))+st;
  return String(v%1===0?v:v.toFixed(1));
 });
}
function snapKg(kg){var v=parseFloat((''+kg).replace(/kg/i,'').replace(',','.'));if(isNaN(v))return null;v=Math.round(v/5)*5;return Math.max(5,Math.min(80,v));}

// dell'attrezzo, e riarrotondarlo qui a multipli di 5 col tetto 80 vorrebbe dire
// riscrivere 12kg di manubrio in 10 e uno squat da 100 in 80.
function snapBand(band){if(!band||attrezzatura()==='palestra')return band;var m=(''+band).match(/\d+(?:[.,]\d+)?(?!.*\d)/);if(!m)return band;var s=snapKg(m[0]);return s==null?band:s+'kg';}

 // Precedenza: coachPlan (Sumi) > progression (regola meccanica) > carico reale (chat/manuale) > DB
 var cp=(S.aiDB.coachPlan&&S.aiDB.coachPlan.perExercise&&S.aiDB.coachPlan.perExercise[e.id]);
 var pr=(S.aiDB.progression&&S.aiDB.progression[e.id]);
 var o=cp||pr;

  if(o.repsMax)ov.repsMax=o.repsMax;

  if(o.attrezzo)ov.attrezzo=o.attrezzo;   // "manubri"/"bilanciere"/… → etichetta del carico
  if(o.stima)ov.stima=true;               // carico mai verificato: la scheda lo dichiara
  ov.coachNote=o.note||'';

function computeProgression(session){
 // Doppia progressione dalle reps loggate per-serie. Sincrona, offline.
 try{
  var reps=session.reps||{};
  if(!S.aiDB.progression)S.aiDB.progression={};
  Object.keys(reps).forEach(function(id){
   var r=reps[id];if(!r||!r.reps||!r.reps.length)return;
   var sets=r.reps,max=r.max||r.target||8,target=r.target||8,nSets=sets.length;
   var allTop=sets.every(function(x){return x>=max;});
   var allBelow=sets.every(function(x){return x<target;});
   var prevProg=S.aiDB.progression[id]||{};
   var cur=prevProg.band||r.band||'';
   var hasBand=!!cur; // niente elastico → esercizio a corpo libero, progressione su reps invece che su carico
   var entry={name:r.name,date:new Date().toISOString().split('T')[0],lastReps:sets};
   if(allTop&&nSets>=2){
    if(hasBand){
     entry.band=nextBandStep(cur,id);
     entry.note='+'+(attrezzatura()==='palestra'?stepDi(id):5)+'kg: chiuso il max ('+sets.join(',')+')';
    } else {
     var curTarget=prevProg.reps||target,curMax=prevProg.repsMax||max;
     if(curMax>=25){
      entry.note='Tetto reps raggiunto (25) — passa a variante più dura: chiuso il max ('+sets.join(',')+')';
     } else {
      entry.reps=Math.min(25,curTarget+2);
      entry.repsMax=Math.min(25,curMax+2);
      entry.note='+2 reps ('+entry.reps+'-'+entry.repsMax+'): chiuso il max ('+sets.join(',')+')';
     }
    }
   } else if(allBelow&&nSets>=2){
    entry.band=cur;entry.note='Sotto target ('+sets.join(',')+') — mantieni e consolida';
   } else {
    entry.band=cur;entry.note='In progressione ('+sets.join(',')+') — punta a chiudere il range';
   }
   S.aiDB.progression[id]=Object.assign({},S.aiDB.progression[id],entry);
  });
  sv('ai',S.aiDB);
 }catch(e){console.error('computeProgression:',e);}
}

// opts.home = seduta A CASA: stesso split, stessi slot, pool a corpo libero (HOME_DB).
// Core e finisher cardio non cambiano — sono già senza attrezzi in entrambi i rami.
function genWorkout(splitIdx,opts){
 opts=opts||{};
 var home=!!opts.home;
 var SRC=function(cat){return (home&&HOME_DB[cat])||DB[cat]||[];};
 var split=PLAN[splitIdx%6];
 var adapt=S.aiDB.adaptation||{};
 var avoid=adapt.avoidExercises||[];
 var suggest=adapt.suggestExercises||[];
 // A casa i `must` non si applicano: sono id del ramo palestra (lat machine, squat bilanciere…)
 // che a corpo libero non esistono. Forzarli lascerebbe lo slot vuoto invece di riempirlo.
 var must=home?[]:(split.must||[]).slice(); // esercizi sempre presenti (es. bicipiti garantiti sui pull day)
 var exercises=[],used=[],gaps=[];
 Object.entries(split.cats).forEach(function(entry){
  var cat=entry[0],count=entry[1];
  // "must" di questa categoria forzati per primi (rispettano gli avoid del coach), contano nel count
  var forced=[];
  must.forEach(function(id){
   if(forced.length>=count)return;
   var e=SRC(cat).find(function(x){return x.id===id;});
   if(e&&!avoid.includes(id)&&!used.includes(id))forced.push(e);
  });
  var notForced=function(e){return !forced.find(function(p){return p.id===e.id;});};
  var preferred=SRC(cat).filter(function(e){return suggest.includes(e.id)&&!avoid.includes(e.id)&&!used.includes(e.id)&&recoveryAllows(e)&&notForced(e);});
  var pool=SRC(cat).filter(function(e){return !avoid.includes(e.id)&&!used.includes(e.id)&&recoveryAllows(e)&&!preferred.find(function(p){return p.id===e.id;})&&notForced(e);});
  var sel=forced.concat(preferred.concat(shuf(pool)).slice(0,Math.max(0,count-forced.length)));
  // RIEMPI SEMPRE: se il pool "pulito" non copre `count`, rientrano gli esclusi morbidi
  // (gli `avoidExercises` del coach). Motivo: la categoria pull ha 6 esercizi per 5 slot,
  // quindi basta un buco per consegnare una seduta corta — e in silenzio. Meglio un esercizio
  // che non avresti scelto di uno slot vuoto. `recoveryAllows` resta invece un vincolo duro:
  // è sicurezza post-intervento, non una preferenza.
  if(sel.length<count){
   var already=function(e){return !!sel.find(function(x){return x.id===e.id;});};
   var backup=SRC(cat).filter(function(e){return !used.includes(e.id)&&!already(e)&&recoveryAllows(e);});
   sel=sel.concat(shuf(backup).slice(0,count-sel.length));
  }
  if(sel.length<count){gaps.push(cat+' '+sel.length+'/'+count);console.warn('[gen] '+cat+': '+sel.length+'/'+count+' — pool esaurito');}
  sel.forEach(function(e){exercises.push(applyAdaptation(withCoachOverride(e)));used.push(e.id);});
 });
 // Scegli un circuito core casuale e costruisci la sequenza
 var circuit=DB.coreCircuits[splitIdx%DB.coreCircuits.length]; // ruota per giorno → varietà settimanale
 var coreById={};DB.core.forEach(function(e){coreById[e.id]=e;});
 // 1) dedup per famiglia di movimento: la seconda variante della stessa famiglia
 //    viene sostituita da un esercizio di riserva mai usato dal circuito
 var famSeen={},seqUsed={},seq=circuit.seq.map(function(id){
  if(id==='B')return id;
  var fam=CORE_FAM[id];
  if(fam&&famSeen[fam]){
   var sub=CORE_SPARE.find(function(s){
    return coreById[s]&&!seqUsed[s]&&circuit.seq.indexOf(s)<0&&!(CORE_FAM[s]&&famSeen[CORE_FAM[s]]);
   });
   if(sub){id=sub;fam=CORE_FAM[sub];}
   else return null; // nessun rimpiazzo pulito: meglio un esercizio in meno di un doppione
  }
  if(fam)famSeen[fam]=1;
  seqUsed[id]=1;

 // 2) espansione: gli unilaterali diventano DUE blocchi, metà tempo ciascuno,
 //    così il secondo lato non dipende dal fatto che l'atleta se lo ricordi
 var core=[];
 seq.forEach(function(id,idx){
  if(id==='B'){core.push({id:'brk'+idx,cat:'core',name:'RIPOSO',desc:'Respira. Prossimo blocco tra poco.',muscles:'',isBreak:true,isCore:true,isTime:true,time:30,sets:1});return;}
  var e=coreById[id];
  if(!e)return;
  var base=applyAdaptation(Object.assign({},e,{isCore:true,isTime:true,sets:1}));
  if(!e.perSide){core.push(base);return;}
  var half=Math.max(15,Math.round((base.time||40)/2));
  core.push(Object.assign({},base,{id:e.id+'-L1',name:e.name+' · 1° lato',time:half,perSide:true}));
  core.push(Object.assign({},base,{id:e.id+'-L2',name:e.name+' · 2° lato',time:half,perSide:true,desc:'CAMBIA LATO. '+base.desc}));
 });
 // 3) finisher cardio: blocco corto in coda, ruota per giorno
 var nk=DB.cardio.length,pickK=[],cardio=[];
 for(var ki=0;ki<nk&&pickK.length<CARDIO_N;ki++){
  var cand=DB.cardio[(splitIdx*CARDIO_N+ki)%nk];
  if(cand&&!avoid.includes(cand.id)&&recoveryAllows(cand)&&pickK.indexOf(cand)<0)pickK.push(cand);
 }

  pickK.forEach(function(k,kj){
   cardio.push(Object.assign({},k,{isCore:true,isTime:true,isCardio:true,sets:1,time:k.time||30}));

}
function buildSteps(all){
 var s=[];
 var coreIntroAdded=false;
 all.forEach(function(ex,ei){
  if(ex.isCore){
   // Inserisci schermata intro + countdown 10s prima del primo esercizio core
   if(!coreIntroAdded){
    coreIntroAdded=true;
    s.push({type:'core_intro'});
    s.push({type:'rest',dur:10,isCoreEntry:true,nextName:''});
   }
   // Circuito core: flusso automatico
   if(ex.isBreak){
    // Pausa 30s — step di rest speciale
    s.push({type:'rest',dur:30,isCoreBreak:true,nextName:all[ei+1]?all[ei+1].name:''});
   } else {
    s.push({type:'work',ex:ex,exIdx:ei,setNum:1,totalSets:1});
    if(ei<all.length-1&&!all[ei+1].isBreak){
     // 8s transizione verso prossimo esercizio
     s.push({type:'rest',dur:8,isTransition:true,nextName:all[ei+1]?all[ei+1].name:''});
    } else if(ei<all.length-1&&all[ei+1].isBreak){
     // nessuna transizione — la pausa è subito dopo
    }
   }
  } else {
   var ts=ex.sets||3;
   for(var i=1;i<=ts;i++){
    // Ultima serie a carico = AMRAP: sfonda il tetto del range così la regola di progressione (tutte le serie ≥ repsMax) scatta prima
    s.push({type:'work',ex:ex,exIdx:ei,setNum:i,totalSets:ts,amrap:(i===ts)});
    if(i<ts) s.push({type:'rest',dur:(ex.restSec||90),isSetRest:true,nextName:ex.name,nextBand:ex.band||null});
    else if(ei<all.length-1) s.push({type:'rest',dur:60,isSetRest:false,nextName:all[ei+1].name,nextBand:all[ei+1].band||null});
   }
  }
 });
 return s;
}

// ─── SYNC-DOWN (contratto: wiki/Personale/allenamento/sync-contract.md) ──────
// mergeDown: applica il blob server sopra lo stato locale (last-wins/unione/blind).
// newer(): confronto per timestamp REALE (Date.parse), non lessicografico — i produttori
// usano formati ISO diversi (app '…Z' UTC, server '…+00:00'/'+02:00') che il confronto
// stringa ordinerebbe male. Assente/invalido = piu' vecchio (il presente vince sull'assente).
function _ts(x){var t=x?Date.parse(x):NaN;return isNaN(t)?-Infinity:t;}
function newer(a,b){return _ts(a)>_ts(b);}
function mergeByKey(dst,src,tsField){ // mappa chiave→record: per chiave vince tsField piu' recente
 if(!src||typeof src!=='object')return dst||{};

  var s=src[k],d=dst[k];
  if(!d||newer(s&&s[tsField],d&&d[tsField]))dst[k]=s;
 }

// Prima era 1: `maxBack` (7gg) era calcolata e mai usata, e `startDate` ricadeva
// sempre su ieri perche' `firstDate > yesterday` e' falso per definizione (il primo
// allenamento non e' nel futuro). L'intenzione era una finestra, l'implementazione
// era collassata a un giorno solo.
var NUT_WINDOW_DAYS=20;
function nutWindowDays(){
 var out=[];
 var yesterday=new Date(Date.now()-86400000).toISOString().split('T')[0];
 var maxBack=new Date(Date.now()-NUT_WINDOW_DAYS*86400000).toISOString().split('T')[0];
 // Non si va piu' indietro del primo allenamento: prima non c'era niente da compilare.
 var firstSession=(S.history||[])[0];
 var firstDate=firstSession&&firstSession.date?firstSession.date.split('T')[0]:null;
 var startDate=(firstDate&&firstDate>maxBack)?firstDate:maxBack;
 for(var d=new Date(startDate+'T12:00:00Z');d.toISOString().split('T')[0]<=yesterday;d.setDate(d.getDate()+1)){
  out.push(d.toISOString().split('T')[0]);
 }

}

// solo non sa dei giorni compilati altrove (dashboard, altro device) e li riproporrebbe
// in eterno.
// NON si usa `metrics.buchi`: quella lista esclude per progetto i giorni con kcal STIMATA
// (kcalSource="stima"), che sono a tutti gli effetti ancora da compilare — leggerla li
// farebbe sparire dalla lista in silenzio (il 03/08 sarebbe vuota: 28-30/07 e 02/08 sono
// tutti stimati). `days[ds].nutrition.score` invece esiste solo se la survey c'e' davvero:

function nutFilledOnServer(ds){
 var days=(S.aiDB.metrics||{}).days;

function startTimer(){
 clearInterval(TI);
 var step=S.wSteps[S.wStepIdx];if(!step)return;
 if(S.wAwaitReps)return; // nessun timer mentre selezioni le reps
 if(step.type==='core_intro'){return;} // nessun timer — l'utente preme PRONTO
 if(step.type==='rest'){
  S.wTimer=step.dur;
  TI=setInterval(function(){
   if(S.wPaused)return;
   S.wTimer=Math.max(0,S.wTimer-1);
   var el=document.getElementById('wt-rest');if(el)el.textContent=S.wTimer;
   if(S.wTimer<=0){clearInterval(TI);advStep();}
  },1000);
 } else {
  var ex=step.ex;
  if(ex.isCore&&ex.isTime){
   // Circuito core: auto-avanza a fine timer
   S.wTimer=ex.time;S.wElapsed=0;
   TI=setInterval(function(){
    if(S.wPaused)return;
    S.wTimer=Math.max(0,S.wTimer-1);S.wElapsed++;
    var e=document.getElementById('wt-core-timer');if(e)e.textContent=S.wTimer;
    if(S.wTimer<=0){clearInterval(TI);S.wSets++;advStep();}
   },1000);
  } else if(ex.isTime){
   S.wTimer=ex.time;S.wElapsed=0;
   TI=setInterval(function(){S.wTimer=Math.max(0,S.wTimer-1);S.wElapsed++;var e=document.getElementById('wt-timer');if(e)e.textContent=S.wTimer+'s';},1000);
  } else {
   S.wTimer=0;S.wElapsed=0;
   TI=setInterval(function(){S.wElapsed++;var e=document.getElementById('wt-elapsed');if(e)e.textContent=fmt(S.wElapsed);},1000);
  }
 }
}
function advStep(){S.wStepIdx++;if(S.wStepIdx>=S.wSteps.length){finishWorkout();return;}render();}
function workoutDone(){
 var step=S.wSteps[S.wStepIdx];var ex=step&&step.ex;
 // Esercizi a carico (a reps, non a tempo, non core): chiedi quante reps fatte
 if(ex&&!ex.isTime&&!ex.isCore&&!S.wAwaitReps){clearInterval(TI);S.wAwaitReps=true;render();return;}
 clearInterval(TI);S.wAwaitReps=false;S.wSets++;advStep();
}
function logReps(n){
 var step=S.wSteps[S.wStepIdx];var ex=step&&step.ex;
 if(ex){if(!S.wReps[ex.id])S.wReps[ex.id]={name:ex.name,target:ex.reps,max:ex.repsMax||ex.reps,band:ex.band||'',reps:[]};S.wReps[ex.id].reps.push(n);}
 S.wAwaitReps=false;S.wSets++;advStep();
}
function setLoad(id){
 // Feedback per Sumi: NON cambia la scheda al volo. Sumi lo valuta e decide il carico.
 var ex=(S.wEx||[]).find(function(x){return x.id===id;})||{};
 var cur=(S.aiDB.loads&&S.aiDB.loads[id]&&S.aiDB.loads[id].kg)||'';
 var v=prompt('Feedback a Sumi per "'+(ex.name||'')+'" — quanto hai davvero usato (es. 40). Lo valuta Sumi di notte, non cambia subito la scheda. Vuoto = togli:',cur);
 if(v===null)return;
 v=(''+v).trim();
 if(!S.aiDB.loads)S.aiDB.loads={};
 if(v===''){if(S.aiDB.loads[id])delete S.aiDB.loads[id];}
 else{
  S.aiDB.loads[id]={kg:v.replace(/kg/i,'').replace(/\s/g,''),name:ex.name,date:new Date().toISOString().split('T')[0],updatedAt:new Date().toISOString(),manual:true};
 }
 sv('ai',S.aiDB);render();
}
function skipRest(){clearInterval(TI);advStep();}
function pauseCore(){S.wPaused=true;var e=document.getElementById('core-pause-btn');if(e){e.textContent='▶ Riprendi';e.onclick=resumeCore;}}
function resumeCore(){S.wPaused=false;var e=document.getElementById('core-pause-btn');if(e){e.textContent='Pausa';e.onclick=pauseCore;}}
function wBack(){

 var prev=S.wStepIdx-1;
 while(prev>0&&S.wSteps[prev].type!=='work')prev--;

 else go('home');
}
// "Cambia" = ROTAZIONE nello stesso slot, NON un ban (12/08/2026).
// Prima: il tasto metteva l'esercizio in skip per 14 giorni e lo toglieva dal pool — un click
// per curiosità bruciava un esercizio, e con PULL a 5 slot su 6 esercizi bastava per svuotare
// la seduta. Ora la lista dei candidati si costruisce alla prima pressione con l'ORIGINALE IN
// TESTA, e ogni pressione avanza di uno chiudendo il ciclo: finite le alternative si torna al
// primo. Mai un vicolo cieco, e nessun effetto fuori dalla seduta in corso: la lista dei banditi
// è stata rimossa insieme al vecchio comportamento (vedi dropSkipState).
// Per togliere davvero un esercizio resta `avoidExercises` dell'adattamento IA, che scrive il coach.
function skipExercise(){
 clearInterval(TI);var step=S.wSteps[S.wStepIdx];if(step.type!=='work')return;
 var ex=step.ex,slot=step.exIdx;
 var rot=S.wAlt[slot];
 if(!rot){
  // Candidati: stessa categoria, non già in seduta in un altro slot, ammessi dal recupero.
  var inSession=S.wEx.filter(function(x,i){return i!==slot;});
  var shape={isCore:ex.isCore,isTime:ex.isTime,isCardio:ex.isCardio,isExtra:ex.isExtra,perSide:ex.perSide};
  // stessa sorgente della seduta: in casa le alternative sono a corpo libero, non della palestra
  var cands=((S.homeMode&&HOME_DB[ex.cat])||DB[ex.cat]||[]).filter(function(e){
   return e.id!==ex.id&&!inSession.find(function(x){return x.id===e.id;})&&recoveryAllows(e);
  }).map(function(e){
   // stessa forma dello slot (core/tempo/cardio): altrimenti un core diventa un reps-based
   var n=Object.assign({},applyAdaptation(withCoachOverride(e)),shape);
   if(ex.isTime)n.time=ex.time||n.time;
   if(ex.isCore)n.sets=1;
   return n;
  });
  rot={list:[ex].concat(shuf(cands)),i:0};
  S.wAlt[slot]=rot;
 }
 if(rot.list.length<2){console.log('[cambia] nessuna alternativa per',ex.id);render();return;}
 // Avanza di uno chiudendo il ciclo, saltando chi nel frattempo è finito in un altro slot:
 // le liste sono per-slot e congelate alla prima pressione, quindi senza questo controllo due
 // slot che ruotano convergono sullo stesso esercizio (vale anche per l'originale, che un altro
 // slot può aver preso). Se sono tutti occupati resta dov'è invece di duplicare.
 var next=-1;
 for(var t=1;t<=rot.list.length;t++){
  var j=(rot.i+t)%rot.list.length;
  if(!S.wEx.find(function(x,i){return i!==slot&&x.id===rot.list[j].id;})){next=j;break;}
 }
 if(next<0){console.log('[cambia] tutte le alternative sono già in seduta');render();return;}
 rot.i=next;
 var ne=S.wEx.slice();ne[slot]=rot.list[rot.i];
 S.wEx=ne;S.wSteps=buildSteps(ne);
 var fi=S.wSteps.findIndex(function(s){return s.type==='work'&&s.exIdx===slot&&s.setNum===1;});
 S.wStepIdx=Math.max(0,fi);
 render();
}

 if(S.homeMode)S.pending.home=true; // marca la seduta come fatta a casa: spiega al coach perché non ci sono kg

}

async function finishSession(){

  var session=Object.assign({},S.pending||{},{quiz:S.qAns,preCheck:S.preWQAns||{},date:new Date().toISOString()});
  S.preWQAns={};
  // Le sedute a casa CONTANO come le altre (avanzano lo split, entrano in progressione).
  // `extra` resta letto solo per le vecchie sessioni additive già nello storico, che non
  // devono cambiare significato a posteriori: nessuno lo scrive più.
  var isExtra=!!session.extra;
  // aiDB.sessions deprecato 2026-08-02: duplicava history (l'unica fonte letta a valle).
  S.aiDB.patterns=calcPatterns();
  var nh=(S.history||[]).concat([session]);

  if(!isExtra)S.splitIdx=(S.splitIdx||0)+1;
  if(!isExtra){S.aiDB.splitIdx=S.splitIdx;S.aiDB.splitIdxUpdatedAt=new Date().toISOString();sv('ai',S.aiDB);} // timbro edit reale (last-wins) + push in su
  await sv('wh',nh);
  if(!isExtra)await sv('si',String(S.splitIdx));
  if(!isExtra)computeProgression(session); // regola meccanica: aggiorna carichi/progressione dalle reps
  syncToDrive();
  // runAdaptation rimosso 2026-08-02: il piano lo modula solo Sumi notturna (coachPlan).
 }catch(e){console.error('finishSession:',e);}
 S.homeMode=false;
 go('home');
}

async function fileToJpegBase64(file){
 // Decodifica: createImageBitmap legge HEIC su Safari iOS; fallback <img> per il resto.
 var bmp;
 try{bmp=await createImageBitmap(file);}
 catch(e){
  bmp=await new Promise(function(res,rej){
   var url=URL.createObjectURL(file);
   var img=new Image();
   img.onload=function(){URL.revokeObjectURL(url);res(img);};
   img.onerror=function(){URL.revokeObjectURL(url);rej(new Error('Formato non supportato (HEIC?). Usa JPG/PNG.'));};
   img.src=url;
  });
 }
 // 2576 px sul lato lungo (era 1280) dal 04/08: e' il massimo della fascia alta-risoluzione dei
 // modelli attuali. Su un piatto misto la risoluzione E' l'accuratezza — riconoscere sei
 // componenti e leggere le porzioni dai riferimenti di scala (posata, bordo del piatto) richiede
 // pixel, e a 1280 px un mezze o un curry diventano una macchia da indovinare. Costa fino a ~3x i
 // token immagine (~4784 contro ~1568): e' il prezzo dell'unica leva che sposta davvero la stima.
 // Nessun upscaling: si scala solo verso il basso, una foto piu' piccola resta com'e'.
 var w=bmp.width,h=bmp.height,max=2576;
 if(w>max||h>max){var s=Math.min(max/w,max/h);w=Math.round(w*s);h=Math.round(h*s);}
 var cv=document.createElement('canvas');cv.width=w;cv.height=h;
 cv.getContext('2d').drawImage(bmp,0,0,w,h);

}

 if(sp==null||sp==='')return '—';
 var key=String(sp).toUpperCase();
 if(SPLIT_LABELS[key])return SPLIT_LABELS[key];
 return String(sp).charAt(0).toUpperCase()+String(sp).slice(1).toLowerCase();
}
// markdown → HTML leggero per i recap discorsivi del coach (bold + heading + a capo).
function mdLite(s){
 return String(s||'')
  .replace(/^#{1,6}\s*(.+)$/gm,'<strong>$1</strong>')
  .replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>')
  .replace(/\n/g,'<br>');
}

/* ═══ WKUI — consigli/card di Sumi in home ═════════════════════════════════════
   Vetrina SOLA LETTURA: un cervello (Sumi) alimenta app+dashboard dallo stesso feed.
   I 4 grafici SVG (benessere/kcal/proteine/frequenza) e il vecchio fallback
   buildHistChart() sono usciti dall'app il 03/08/2026: storico, grafici e feedback di
   Sumi si leggono in Sumi Legacy. L'app e' il posto dove si INSERISCE, Legacy quello
   dove si LEGGE. Qui restano solo i consigli e le card della home — la spinta ad agire,
   non l'analisi. Non riportarli: la doppia vetrina e' esattamente cio' che si e' tolto. */
var WKUI=(function(){
 var REPORT_COLOR={good:'#22c55e',warn:'#f59e0b',bad:'#ef4444',accent:'#F97316'};
 function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
 function reportColor(c){return REPORT_COLOR[c]||REPORT_COLOR.accent;}

 return {
  hasReport:function(report){return !!(report&&((report.consigli&&report.consigli.length)||(report.card&&report.card.length)));},
  /* HOME §1 — consigli di Sumi (lista numerata, stile nativo home) */
  consigli:function(report){
   var list=(report&&report.consigli)||[];if(!list.length)return '';
   var items=list.map(function(c,i){
    return "<div style='position:relative;background:#18181b;border:1px solid #27272a;border-radius:12px;padding:11px 13px 11px 42px;margin-bottom:8px'>"
     +"<div style='position:absolute;left:11px;top:11px;width:22px;height:22px;background:#F97316;color:#000;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800'>"+(i+1)+"</div>"
     +"<div style='font-size:14px;font-weight:700;color:#fafafa;line-height:1.35'>"+esc(c.titolo||'')+"</div>"
     +(c.spiegazione?"<div style='font-size:12.5px;color:#a1a1aa;line-height:1.5;margin-top:4px'>"+esc(c.spiegazione)+"</div>":'')
     +"</div>";
   }).join('');
   return "<div style='margin-top:18px'>"
    +"<div class='lbl' style='font-size:11px;color:#F97316;margin-bottom:10px'>▸ Consigli di Sumi</div>"
    +items+"</div>";
  },
  /* HOME §2 — cosa dicono i dati (card verdetto, colore = verdetto) */
  cards:function(report){
   var cards=(report&&report.card)||[];if(!cards.length)return '';
   var cells=cards.map(function(c){var col=reportColor(c.colore);
    return "<div style='background:#18181b;border:1px solid "+col+"55;border-radius:12px;padding:11px 12px;display:flex;flex-direction:column;gap:4px'>"
     +"<div style='font-size:11px;text-transform:uppercase;letter-spacing:.05em;font-weight:700;color:"+col+"'>"+esc(c.tag||'')+"</div>"
     +"<div style='font-size:18px;font-weight:800;color:#fafafa;line-height:1.15;font-family:Space Grotesk'>"+esc(c.numero||'')+"</div>"
     +(c.frase?"<div style='font-size:12px;color:#a1a1aa;line-height:1.45'>"+esc(c.frase)+"</div>":'')
     +"</div>";
   }).join('');
   return "<div style='margin-top:18px'>"
    +"<div class='lbl' style='font-size:11px;color:#a1a1aa;margin-bottom:10px'>Cosa dicono i dati</div>"
    +"<div style='display:grid;grid-template-columns:1fr 1fr;gap:8px'>"+cells+"</div></div>";
  }
 };
})();

// ─── NUTRIZIONE · gli ultimi 20 giorni ───────────────────────────────────────
// Questa pagina era lo STORICO: 3 tessere di numeri, i 4 grafici di Sumi e le card
// giorno-per-giorno con i punteggi derivati. Dal 03/08/2026 storico, grafici e feedback
// di Sumi si leggono in Sumi Legacy — l'app e' il posto dove si INSERISCE. Qui resta
// l'unica cosa che si fa col telefono in mano: COMPILARE la nutrizione, anche indietro.
// La finestra e' la stessa di getMissingNutritionDays (NUT_WINDOW_DAYS): un giorno che
// il promemoria considera da compilare e' un giorno che si vede e si tocca, sempre.
// Il giorno in corso c'e' in cima ma non e' mai un buco: la giornata non e' finita.
function rHist(){
 var log=S.aiDB.nutritionLog||{};
 var todayStr=new Date().toISOString().split('T')[0]; // UTC, come le chiavi nutritionLog
 var giorni=nutWindowDays().slice().reverse();        // da ieri all'indietro
 giorni.unshift(todayStr);
 var mancanti=getMissingNutritionDays().length;
 function stato(ds){
  var v=log[ds];
  if(v&&!v.skipped)return 'compilato';
  if(v&&v.skipped)return 'saltato';
  if(ds===todayStr)return 'oggi';
  return nutFilledOnServer(ds)===true?'compilato_altrove':'buco';
 }
 var cards=giorni.map(function(ds){
  var st=stato(ds);
  var v=log[ds];
  var score=(st==='compilato')?calcNutScore(v,ds):null; // ricalcolo con la formula attuale
  var col=st==='compilato'?(score>=75?'#22c55e':score>=50?'#f59e0b':'#ef4444')
        :st==='compilato_altrove'?'#3f3f46'
        :st==='buco'?'#ef4444':'#3f3f46';
  var kcal=(st==='compilato'&&v.calories_kcal)?v.calories_kcal:null;
  var kcalHtml='';
  if(kcal){
   // Verdetto solo se il target del giorno E' PUBBLICATO (dayCal): niente etichetta se manca,
   // perche' l'unico modo di averla sarebbe ricalcolarsi il target qui. La soglia (`tol`) la
   // decide workout_targets.py e viaggia nel feed: prima erano 150 qui e 100 sul server, cioe'
   // due giudizi diversi sulla stessa giornata.
   var dc=dayCal(ds);
   if(dc){
    var delta=kcal-dc.target,tol=dc.tol;
    var lab=Math.abs(delta)<=tol?'Mantenimento':delta>tol*4?'Surplus alto':delta>0?'Surplus':delta>-tol*4?'Deficit lieve':'Deficit';
    var lc=Math.abs(delta)<=tol?'#22c55e':delta>tol*4?'#ef4444':delta>0?'#f97316':'#818cf8';
    kcalHtml='<div style="text-align:right;flex-shrink:0"><div style="font-size:13px;font-weight:700;color:#d4d4d8">'+kcal+' kcal</div><div style="font-size:10px;font-weight:700;color:'+lc+'">'+lab+'</div></div>';
   } else {
    kcalHtml='<div style="text-align:right;flex-shrink:0"><div style="font-size:13px;font-weight:700;color:#d4d4d8">'+kcal+' kcal</div><div style="font-size:10px;font-weight:700;color:#52525b">—</div></div>';
   }
  }
  var dateStr=new Date(ds+'T12:00:00').toLocaleDateString('it-IT',{weekday:'long',day:'numeric',month:'short'});
  if(ds===todayStr)dateStr='Oggi · '+dateStr;
  // sottotitolo: cosa e' stato quel giorno (serve a ricordarsi cosa si e' mangiato)
  var sess=(S.history||[]).filter(function(h){return h.date&&h.date.split('T')[0]===ds;});
  var sub=sess.length
   ?sess.map(function(s){var nm=(s.split&&s.split.name)?splitLabel(s.split.name):'Workout';return nm+' · '+(s.duration||'?')+'min';}).join('  +  ')
   :'Riposo';
  var badge=st==='buco'?'<span style="background:#450a0a;border:1px solid #ef4444;color:#fca5a5;font-size:9px;font-weight:700;padding:1px 6px;border-radius:6px;margin-left:6px;vertical-align:middle">da compilare</span>'
   :st==='saltato'?'<span style="background:#1c1c1e;border:1px solid #3f3f46;color:#71717a;font-size:9px;font-weight:700;padding:1px 6px;border-radius:6px;margin-left:6px;vertical-align:middle">saltato</span>'
   :st==='compilato_altrove'?'<span style="background:#0f172a;border:1px solid #334155;color:#94a3b8;font-size:9px;font-weight:700;padding:1px 6px;border-radius:6px;margin-left:6px;vertical-align:middle">gia\' su Sumi</span>'
   :'';
  var azioni=(st==='compilato')
   ?'<button onclick="openNutritionDay(\''+ds+'\')" style="flex:1;padding:8px;border-radius:9px;border:1px solid #3f3f46;background:transparent;color:#a1a1aa;font-size:12px;font-weight:700;cursor:pointer">Modifica</button>'
    +'<button onclick="removeNutritionDay(\''+ds+'\')" style="padding:8px 12px;border-radius:9px;border:1px solid #7f1d1d;background:transparent;color:#f87171;font-size:12px;font-weight:700;cursor:pointer">Rimuovi</button>'
   :'<button onclick="openNutritionDay(\''+ds+'\')" style="flex:1;padding:8px;border-radius:9px;border:1px solid '+(st==='buco'?'#f59e0b':'#3f3f46')+';background:transparent;color:'+(st==='buco'?'#f59e0b':'#a1a1aa')+';font-size:12px;font-weight:700;cursor:pointer">'+(st==='compilato_altrove'?'Sovrascrivi':'Compila')+'</button>';
  return '<div style="background:#18181b;border:1px solid '+(st==='buco'?'#7f1d1d':'#27272a')+';border-radius:14px;padding:12px;margin-bottom:8px">'
   +'<div style="display:flex;align-items:center;gap:10px">'
   +'<div style="width:38px;height:38px;border-radius:50%;border:2.5px solid '+col+';display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:900;color:'+col+';flex-shrink:0">'+(score!==null?score:'—')+'</div>'
   +'<div style="flex:1;min-width:0">'
   +'<div style="font-weight:700;font-size:13px;color:#fafafa">'+dateStr+badge+'</div>'
   +'<div style="font-size:11px;color:#71717a;margin-top:1px">'+sub+'</div>'
   +'</div>'
   +kcalHtml
   +'</div>'
   +'<div style="display:flex;gap:6px;margin-top:10px">'+azioni+'</div>'
   +'</div>';
 }).join('');
 return '<div class="pg">'
  +'<div class="hdr"><button class="back" onclick="go(\'home\')" style="margin:0">←</button><span style="font-weight:800;font-size:16px">NUTRIZIONE</span></div>'
  +(mancanti>0
   ?'<button class="btn" style="background:#f59e0b;color:#000;margin:0 0 12px" onclick="openNutrition()">Compila i '+mancanti+' giorni mancanti →</button>'
   :'<div style="background:#0f1a0f;border:1px solid #22c55e30;border-radius:12px;padding:10px 14px;margin-bottom:12px;color:#22c55e;font-size:12px;font-weight:700;text-align:center">Ultimi '+NUT_WINDOW_DAYS+' giorni: nessun buco</div>')
  +cards
  +'<div style="font-size:10px;color:#3f3f46;text-align:center;margin-top:14px;line-height:1.5">Grafici, punteggi e feedback di Sumi si leggono in Sumi Legacy.<br>Qui si compila e basta.</div>'
  +'</div>';
}
// Compila o RI-compila un giorno preciso. Sovrascrive: la survey vecchia viene ripresa
// come punto di partenza (nessuno vuole riscrivere da zero per correggere un campo).
function openNutritionDay(date){
 S.trialNutMode=false;
 S.nutQueue=[];S.nutQueueIdx=0;S.nutPhotoUploads=[];S.nutQty={};
 S.nutTarget={date:date};
 var prev=(S.aiDB.nutritionLog||{})[date];
 var seed={};
 if(prev&&!prev.skipped){
  seed=Object.assign({},prev);
  delete seed.savedAt;delete seed.score;   // si ricalcolano al salvataggio
 }
 go('nutrition',{qStep:-1,qAns:seed});
}
// "Rimuovi" = il giorno torna a essere da compilare. NON si cancella la chiave: il
// mergeDown della nutrizione e' LAST-WINS per data su `savedAt`, quindi una chiave
// sparita verrebbe risorta dal blob del server al primo merge. Si scrive invece la
// stessa lapide che usa "Salta" ({skipped:true} con savedAt fresco), che il merge
// rispetta perche' e' piu' recente.
// Le foto pasti del giorno restano, ed e' voluto: se il giorno si ricompila tornano utili.
// Cancellarle in locale non reggerebbe comunque al primo sync, perche' `mealLog` si fonde
// in UNIONE — l'unico modo perche' una rimozione attecchisca e' scrivere il `mealKey` in
// `mealTombstones` (vedi purgeTombstoned), che e' il canale usato per i doppioni del 04/08.
async function removeNutritionDay(date){
 var d=new Date(date+'T12:00:00').toLocaleDateString('it-IT',{weekday:'long',day:'numeric',month:'long'});
 if(!confirm('Rimuovo la nutrizione di '+d+'?\n\nIl giorno torna "da compilare". Le foto pasti restano.'))return;
 if(!S.aiDB.nutritionLog)S.aiDB.nutritionLog={};
 S.aiDB.nutritionLog[date]={skipped:true,savedAt:new Date().toISOString()};
 S.aiDB.nutrition=(S.aiDB.nutrition||[]).filter(function(n){return n.date!==date;});
 await sv('ai',S.aiDB);syncToDrive();
 render();
}

  }
 }catch(e){}
}
async function checkAndGenerateSummaries(){
 return; // DISMESSO: trigger recap in-app (weekly/monthly via Haiku) disattivato — vedi generateWeeklySummary/generateMonthlySummary. Corpo lasciato per reversibilità.
 if(!APIKEY||!S.history||S.history.length===0)return;
 var now=new Date();
 // ─ weekly: se l'ultimo report ha >6 giorni o non esiste
 var lastW=(S.aiDB.weeklyReports||[]).slice(-1)[0];
 var needWeekly=!lastW||(now-new Date(lastW.generatedAt))>6*24*3600*1000;
 if(needWeekly)generateWeeklySummary();
 // ─ monthly: se non c'è un report per questo mese
 var lastM=(S.aiDB.monthlyReports||[]).slice(-1)[0];
 var needMonthly=!lastM||(lastM.month!==(now.getMonth()+1)||lastM.year!==now.getFullYear());
 if(needMonthly)setTimeout(generateMonthlySummary,3000); // piccolo delay per non sovrapporre chiamate
}
function rReports(){
 // Fonte primaria = recap CANONICI del coach (Sonnet, vault) pubblicati in aiDB.metrics.recaps
 // → l'app mostra lo STESSO recap della dashboard Sumi Legacy. Fallback ai vecchi report in-app.
 var mr=(S.aiDB.metrics&&S.aiDB.metrics.recaps)||null;
 var weekly=(mr&&mr.weekly&&mr.weekly.length)?mr.weekly:(S.aiDB.weeklyReports||[]);

 var lastW=weekly.slice(-1)[0];
 var lastM=monthly.slice(-1)[0];
 var wMeta=lastW?((lastW.weekStart||'')+(lastW.weekEnd?'→'+lastW.weekEnd:'')+(lastW.sessions!=null?' · '+lastW.sessions+' sess':'')):'';
 var mMeta=lastM?(lastM.month?(lastM.month+'/'+lastM.year):(lastM.monthStart||''))+(lastM.sessions!=null?' · '+lastM.sessions+' sessioni':''):'';
 var wCard=lastW?'<div style="background:#1a0a00;border:1px solid #f9731630;border-radius:14px;padding:12px;margin-bottom:8px">'
  +'<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">'
  +'<span class="lbl" style="color:#60a5fa">Riepilogo settimanale</span>'
  +'<span style="color:#3f3f46;font-size:10px">'+wMeta+'</span></div>'
  +'<div style="color:#d4d4d8;font-size:12px;line-height:1.6">'+mdLite(lastW.summary)+'</div>'
  +(weekly.length>1?'<div style="color:#3f3f46;font-size:10px;margin-top:6px">'+weekly.length+' riepiloghi settimanali in archivio</div>':'')
  +'</div>':'';
 var mCard=lastM?'<div style="background:#0c1a1a;border:1px solid #14b8a630;border-radius:14px;padding:12px;margin-bottom:8px">'
  +'<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">'
  +'<span class="lbl" style="color:#2dd4bf">Riepilogo mensile</span>'
  +'<span style="color:#3f3f46;font-size:10px">'+mMeta+'</span></div>'
  +'<div style="color:#d4d4d8;font-size:12px;line-height:1.6">'+mdLite(lastM.summary)+'</div>'
  +(monthly.length>1?'<div style="color:#3f3f46;font-size:10px;margin-top:6px">'+monthly.length+' riepiloghi mensili in archivio</div>':'')
  +'</div>':'';
 return '<div style="margin-bottom:10px">'+wCard+mCard+'</div>';
}
function rAI(){
 var msgs=S.aiChat.map(function(m){
  return '<div class="chat-msg" style="background:'+(m.role==='user'?'#431407':'#27272a')+';margin-'+(m.role==='user'?'left':'right')+':40px">'+m.content.replace(/\n/g,'<br>')+'</div>';

async function callAI(messages,system,maxTok){
 if(!getApiKey())return null;
 var r=await fetch(AI_PROXY_URL,{
  method:'POST',
  headers:{
   'Content-Type':'application/json',
   'x-proxy-token':getApiKey()
  },
  body:JSON.stringify({model:'claude-haiku-4-5-20251001',max_tokens:maxTok||400,system:system||'',messages:messages})
 });
 if(!r.ok)throw new Error('HTTP '+r.status);
 var d=await r.json();
 var t=d.content&&d.content.find(function(b){return b.type==='text';});
 return t?t.text:null;
}
async function sendAI(){
 var inp=document.getElementById('ai-in');if(!inp)return;
 var msg=inp.value.trim();if(!msg)return;
 inp.value='';
 S.aiChat.push({role:'user',content:msg});
 if(!getApiKey()){
  S.aiChat.push({role:'assistant',content:'Aggiungi la tua Anthropic API key nel Profilo → API Key.'});
  render();return;
 }
 S.aiLoading=true;S.aiErr='';render();
 var history=S.aiChat.slice(-8).map(function(m){return{role:m.role,content:m.content};});
 history[0]={role:'user',content:buildCtx()+'\n\nDomanda: '+history[0].content};
 try{
  var text=await callAI(history,'Sei il coach personale AI di questo atleta. Rispondi in italiano, diretto e pratico. Max 150 parole.',600);
  S.aiChat.push({role:'assistant',content:text||'Errore'});
 }catch(e){S.aiErr='Errore: '+e.message;}
 S.aiLoading=false;render();
 setTimeout(function(){var el=document.getElementById('ai-msgs');if(el)el.scrollTop=el.scrollHeight;},100);
}
async function runAdaptation(session){
 return; // DISMESSO 2026-08-02 (pipeline Sumi-centrica): l'app non ragiona piu' — il piano lo
 // modula solo il coach notturno (Sumi) via coachPlan. Corpo lasciato per reversibilità.
 // Storia: l'oggetto adaptation scritto qui resto' stale 25/06→02/08 (-1 serie, -10% reps).
 if(!getApiKey())return;
 try{
  var ctx=buildCtx();
  var prompt=ctx+'\n\nSessione appena finita: energia='+session.quiz.energy+'/4 difficolta='+session.quiz.difficulty+'/4 umore='+session.quiz.mood+'/4 durata='+session.duration+'min.\n\nRispondi SOLO con JSON valido senza markdown:\n{"intensity":"aumenta|mantieni|riduci","repsMultiplier":1.0,"setsAdjustment":0,"nextFocus":"stringa breve","avoidExercises":[],"suggestExercises":[],"shortRec":"max 60 parole per la home","reasoning":"breve"}\nrepsMultiplier: es 0.9 = -10% reps, 1.1 = +10%. setsAdjustment: -1, 0, o +1. Modifica solo se c\'è una ragione solida.';
  var text=await callAI([{role:'user',content:prompt}],null,400);
  if(text){
   var clean=text.replace(/```json|```/g,'').trim();
   var obj=JSON.parse(clean);
   S.aiDB.adaptation=Object.assign({},obj,{lastUpdated:new Date().toISOString()});
   await sv('ai',S.aiDB);
  }
 }catch(e){}
}

// ─── FLOATING AI CHAT ────────────────────────────────────────────────────────
function getFloatCtx(){
 // Detect if user is mid-exercise → return exercise-specific context
 if(S.view==='workout'&&S.wSteps&&S.wSteps[S.wStepIdx]&&S.wSteps[S.wStepIdx].type==='work'){
  var step=S.wSteps[S.wStepIdx];
  var ex=step.ex;
  return{
   type:'exercise',
   label:''+ex.name+' — serie '+step.setNum+'/'+step.totalSets,
   extra:'\n\nCONTESTO ESERCIZIO: stai eseguendo "'+ex.name+'" (serie '+step.setNum+'/'+step.totalSets+')\nMuscoli: '+ex.muscles+'\nDescrizione: '+ex.desc+(ex.band?'\nElastico target: '+ex.band:'')+(S.aiDB.loads&&S.aiDB.loads[ex.id]?'\nCarico reale ultima volta: '+S.aiDB.loads[ex.id].kg+'kg ('+S.aiDB.loads[ex.id].date+')':'')
  };
 }
 // General context
 var viewLabel={home:'Home',post_quiz:'Post-workout',nutrition:'Nutrizione',history:'Storico',workout:'Riposo'};
 return{type:'general',label:'Feedback generale — '+(viewLabel[S.view]||S.view),extra:''};
}
function rFloatingAI(){
 var ctx=getFloatCtx();
 var msgs=S.floatChat.map(function(m){
  return '<div class="chat-msg" style="background:'+(m.role==='user'?'#431407':'#27272a')+';margin-'+(m.role==='user'?'left':'right')+':30px;font-size:13px">'+m.content.replace(/\n/g,'<br>')+'</div>';
 }).join('');
 return (S.aiOpen?'':'<button class="ai-fab" onclick="toggleFloatAI()" title="Chiedi al coach">AI</button>')
  +'<div class="ai-slide '+(S.aiOpen?'open':'')+'">'
  +'<div class="ai-slide-head">'
  +'<div>'
  +'<div style="font-size:11px;font-weight:800;color:#fafafa;margin-bottom:4px">COACH AI</div>'
  +'<div class="ai-ctx-pill">'+ctx.label+'</div>'
  +'</div>'
  +'<div style="display:flex;align-items:center;gap:8px">'
  +(S.floatChat.length?'<button onclick="S.floatChat=[];updateFloatAI()" style="background:transparent;border:none;color:#52525b;font-size:11px;cursor:pointer">Pulisci</button>':'')
  +'<button onclick="toggleFloatAI()" style="background:transparent;border:none;color:#a1a1aa;font-size:20px;cursor:pointer;line-height:1;padding:2px 4px">✕</button>'
  +'</div>'
  +'</div>'
  +'<div class="ai-slide-msgs" id="float-msgs">'
  +(!S.floatChat.length?'<div style="color:#52525b;font-size:13px;text-align:center;padding:20px 0">Scrivi una domanda sull\'esercizio o un feedback generale</div>':'')
  +msgs
  +(S.floatLoading?'<div style="color:#71717a;font-size:12px;text-align:center;padding:8px">Il coach risponde...</div>':'')
  +'</div>'
  +'<div class="ai-slide-input">'
  +'<input type="text" id="float-ai-in" placeholder="Chiedi o dai feedback..." onkeydown="if(event.key===\'Enter\')sendFloatAI()">'
  +'<button class="ai-send-btn" onclick="sendFloatAI()">↑</button>'
  +'</div>'
  +'</div>';
}
function toggleFloatAI(){
 S.aiOpen=!S.aiOpen;
 updateFloatAI();
 if(S.aiOpen){
  setTimeout(function(){
   var el=document.getElementById('float-ai-in');if(el)el.focus();
   var msgs=document.getElementById('float-msgs');if(msgs)msgs.scrollTop=msgs.scrollHeight;
  },320);
 }
}
function skipCoreCircuit(){
 clearInterval(TI);
 // Trova il primo step non-core dopo la posizione attuale
 var next=-1;
 for(var i=S.wStepIdx+1;i<S.wSteps.length;i++){
  var s=S.wSteps[i];
  var isCore=(s.type==='work'&&s.ex&&s.ex.isCore)||s.isCoreBreak||s.isTransition||s.type==='core_intro'||s.isCoreEntry;
  if(!isCore){next=i;break;}
 }
 if(next===-1){finishWorkout();}
 else{S.wStepIdx=next;S.wTimer=0;S.wPaused=false;render();}
}
function parseLoad(msg){
 // Match "50kg", "50 kg", "50 chili", "con 50", "ho usato 50" etc.
 var m=msg.match(/(\d+(?:[.,]\d+)?)\s*(?:kg|chili|kili)/i);
 if(m)return parseFloat(m[1].replace(',','.'));
 return null;
}
function findExerciseByName(name){
 var q=(name||'').toLowerCase();
 var cats=['push','pull','shoulders','legs','core'];
 for(var i=0;i<cats.length;i++){
  var list=DB[cats[i]]||[];
  for(var j=0;j<list.length;j++){
   if(list[j].name.toLowerCase().includes(q)||q.includes(list[j].name.toLowerCase().split(' ')[0]))return list[j];
  }
 }
 return null;
}
function currentWorkoutExercise(){
 if(S.view!=='workout'||!S.wSteps)return null;
 for(var i=Math.min(S.wStepIdx,S.wSteps.length-1);i>=0;i--){var s=S.wSteps[i];if(s&&s.type==='work'&&s.ex)return s.ex;}
 return null;
}
async function sendFloatAI(){
 var inp=document.getElementById('float-ai-in');if(!inp)return;
 var msg=inp.value.trim();if(!msg||S.floatLoading)return;
 inp.value='';
 var ctx=getFloatCtx();
 S.floatChat.push({role:'user',content:msg});
 if(!getApiKey()){
  S.floatChat.push({role:'assistant',content:'Aggiungi la tua Anthropic API key nel Profilo → API Key.'});
  updateFloatAI();return;
 }
 S.floatLoading=true;updateFloatAI();
 var system='Sei il personal trainer AI di un atleta avanzato (182cm 74kg, obiettivo massa, corpo libero + elastici). '
  +(ctx.type==='exercise'
   ?'La domanda riguarda un esercizio specifico. Rispondi con consigli tecnici precisi: forma, respiro, errori comuni, modifiche. Diretto e pratico.'
   :'È un feedback o domanda generale. Tienilo in conto per adattare i futuri allenamenti. Rispondi e conferma che hai registrato il feedback.')
  +' Rispondi in italiano, max 120 parole.'
  +' Rispondi SEMPRE con JSON valido: {"reply":"testo risposta","action":{"type":"avoid_exercise","exerciseName":"nome"} oppure null}.'
  +' action è non-null SOLO se l\'utente chiede esplicitamente di rimuovere/evitare/sostituire un esercizio specifico.';
 var baseCtx=buildCtx()+ctx.extra;
 var history=S.floatChat.slice(-6).map(function(m){return{role:m.role,content:m.content};});
 history[0]={role:'user',content:baseCtx+'\n\nDomanda/Feedback: '+history[0].content};
 try{
  var text=await callAI(history,system,400);
  var reply=text||'Errore nella risposta.';
  // Prova a parsare JSON strutturato {reply, action}
  try{
   var clean=reply.replace(/```json|```/g,'').trim();
   var parsed=JSON.parse(clean);
   if(parsed.reply){
    reply=parsed.reply;
    // Esegui azione se presente
    if(parsed.action&&parsed.action.type==='avoid_exercise'&&parsed.action.exerciseName){
     var match=findExerciseByName(parsed.action.exerciseName);
     if(match){
      var avoid=S.aiDB.adaptation.avoidExercises||[];
      if(!avoid.includes(match.id)){
       S.aiDB.adaptation.avoidExercises=avoid.concat([match.id]);
       reply+=' ✓ Ho registrato di evitare '+match.name+' nelle prossime sessioni.';
      }
     }
    }
   }
  }catch(pe){/* fallback: tratta la risposta come testo normale */}
  S.floatChat.push({role:'assistant',content:reply});
  // Save to chatLog for future adaptation
  var exStep=ctx.type==='exercise'&&S.wSteps&&S.wSteps[S.wStepIdx]?S.wSteps[S.wStepIdx]:null;
  S.aiDB.chatLog=(S.aiDB.chatLog||[]).concat([{
   date:new Date().toISOString(),
   contextType:ctx.type,
   exercise:exStep?exStep.ex.id:null,
   exerciseName:exStep?exStep.ex.name:null,
   userMsg:msg,
   reply:reply
  }]);
  // In trial mode: don't persist anything
  if(S.trialMode){S.floatLoading=false;updateFloatAI();setTimeout(function(){var el=document.getElementById('float-msgs');if(el)el.scrollTop=el.scrollHeight;},100);return;}
  // Cattura carico robusta: anche fuori dalla serie attiva, e numero puro senza "kg"
  var loadEx=exStep?exStep.ex:currentWorkoutExercise();
  if(loadEx){
   var detectedKg=parseLoad(msg);
   if(detectedKg==null&&/^\s*\d+(?:[.,]\d+)?\s*$/.test(msg))detectedKg=parseFloat(msg.replace(',','.'));
   if(detectedKg!=null&&detectedKg>0){
    if(!S.aiDB.loads)S.aiDB.loads={};
    S.aiDB.loads[loadEx.id]={kg:detectedKg,name:loadEx.name,date:new Date().toISOString().split('T')[0],updatedAt:new Date().toISOString()};
   }
  }
  // Persist floatChat so it survives panel close/reopen
  S.aiDB.currentChat={date:new Date().toDateString(),msgs:S.floatChat.slice(-30)};
  sv('ai',S.aiDB);
  syncToDrive();
 }catch(e){
  S.floatChat.push({role:'assistant',content:'Errore: '+e.message});
 }
 S.floatLoading=false;updateFloatAI();
 setTimeout(function(){var el=document.getElementById('float-msgs');if(el)el.scrollTop=el.scrollHeight;},100);
}

loadData().then(function(){S.qStep=0;render();checkAndGenerateSummaries();});
